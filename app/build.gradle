plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword
        && releaseKeyAlias && releaseKeyPassword
def versionFile = rootProject.file("version.txt")
if (!versionFile.isFile()) {
    throw new GradleException("Missing version file: ${versionFile}")
}
def defaultVersionName = versionFile.getText("UTF-8").trim()
def buildVersionName = (System.getenv("VERSION_NAME") ?: defaultVersionName)
        .replaceFirst(/-rewrite$/, "")
def autoVersionCode = (System.currentTimeMillis() / 1000L) as int
def buildVersionCode = (System.getenv("VERSION_CODE") ?: autoVersionCode.toString()).toInteger()
def buildReleaseTag = System.getenv("RELEASE_TAG")
        ?: "v${buildVersionName}-build-${buildVersionCode}"

android {
    namespace = "dev.lackluster.redmagichelper"
    compileSdk = 37

    defaultConfig {
        applicationId = "dev.lackluster.redmagichelper"
        minSdk = 34
        targetSdk = 36
        versionCode = buildVersionCode
        versionName = buildVersionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
    }

    lint {
        checkReleaseBuilds = false
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

def gitText = { List<String> arguments ->
    try {
        def process = new ProcessBuilder(["git"] + arguments)
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        String output = process.inputStream.getText("UTF-8")
        return process.waitFor() == 0 ? output.trim() : ""
    } catch (Throwable ignored) {
        return ""
    }
}

tasks.register("writeBuildMetadata") {
    def metadataDir = layout.buildDirectory.dir("generated/version")
    outputs.dir(metadataDir)
    outputs.upToDateWhen { false }
    doLast {
        File outputDir = metadataDir.get().asFile
        outputDir.mkdirs()

        String commit = gitText(["rev-parse", "--short", "HEAD"])
        if (commit.isEmpty()) {
            commit = "unknown"
        }
        String previousTag = gitText([
                "tag", "--list", "v*", "--sort=-creatordate"
        ]).readLines().find { !it.trim().isEmpty() } ?: ""
        String range = previousTag.isEmpty() ? "HEAD~20..HEAD" : "${previousTag}..HEAD"
        String updates = gitText([
                "log", "--no-merges", "--pretty=format:- %s (%h)", range
        ])
        if (updates.isEmpty()) {
            updates = "- No commit summary available"
        }
        String timestamp = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")

        new File(outputDir, "version.properties").text = """\
build.versionCode=${buildVersionCode}
build.versionName=${buildVersionName}
build.releaseTag=${buildReleaseTag}
build.commit=${commit}
build.timestamp=${timestamp}
""".stripIndent()

        new File(outputDir, "BUILD_NOTES.md").text = """\
# RedMagic Helper ${buildVersionName}

- Version code: `${buildVersionCode}`
- Release tag: `${buildReleaseTag}`
- Commit: `${commit}`
- Built: `${timestamp}`

## Updates

${updates}
""".stripIndent()
    }
}

tasks.named("preBuild") {
    dependsOn("writeBuildMetadata")
}

dependencies {
    // Keep the LibXposed API compile-only; LSPosed supplies it at runtime.
    compileOnly files("libs/libxposed-api-102.0.0.jar")
    implementation files("libs/libxposed-service-102.0.0.jar")
    implementation files("libs/libxposed-interface-102.0.0.jar")
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.compose.ui:ui-android"
    implementation "androidx.compose.foundation:foundation-android"
    implementation "androidx.compose.material:material-android"
    implementation "androidx.compose.material3:material3-android:1.5.0-beta01"
    implementation "androidx.compose.runtime:runtime-android"
    implementation "androidx.navigationevent:navigationevent-compose:1.1.2"
    implementation "top.yukonga.miuix.kmp:miuix-nav-android:0.9.4"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "com.materialkolor:material-color-utilities:3.0.1"
    testImplementation files("libs/junit-4.13.2.jar", "libs/hamcrest-core-1.3.jar")
}
