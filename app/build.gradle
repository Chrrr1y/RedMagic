plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword
        && releaseKeyAlias && releaseKeyPassword
def buildVersionCode = (System.getenv("VERSION_CODE") ?: "26091400").toInteger()
def buildVersionName = System.getenv("VERSION_NAME") ?: "4.0.0-rewrite"

android {
    namespace "dev.lackluster.redmagichelper"
    compileSdk 36

    defaultConfig {
        applicationId "dev.lackluster.redmagichelper"
        minSdk 34
        targetSdk 36
        versionCode buildVersionCode
        versionName buildVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    lint {
        checkReleaseBuilds = false
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
    // Keep the LibXposed API compile-only; LSPosed supplies it at runtime.
    compileOnly files("libs/libxposed-api-102.0.0.jar")
    implementation files("libs/libxposed-service-102.0.0.jar")
    implementation files("libs/libxposed-interface-102.0.0.jar")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.ui:ui-android:1.8.3"
    implementation "androidx.compose.foundation:foundation-android:1.8.3"
    implementation "androidx.compose.material:material-android:1.8.3"
    implementation "androidx.compose.material3:material3-android:1.3.2"
    implementation "androidx.compose.runtime:runtime-android:1.8.3"
    testImplementation files("libs/junit-4.13.2.jar", "libs/hamcrest-core-1.3.jar")
}
